name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Generate icons
        run: |
          python packaging\make_icon.py
          python packaging\make_splash.py

      - name: Build recorder helper
        run: python -m PyInstaller packaging\recorder.spec --noconfirm --clean --distpath dist\recorder

      - name: Build SoundPod
        run: python -m PyInstaller packaging\soundpod.spec --noconfirm --clean

      - name: Assemble release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist\SoundPod.exe release
          Copy-Item dist\recorder\SoundPodRecorder.exe release
          New-Item -ItemType Directory -Path release\tools\SoundVolumeView -Force | Out-Null
          Copy-Item tools\SoundVolumeView\SoundVolumeView.exe release\tools\SoundVolumeView
          Copy-Item tools\SoundVolumeView\readme.txt release\tools\SoundVolumeView
          Copy-Item tools\SoundVolumeView\SoundVolumeView.chm release\tools\SoundVolumeView
          Copy-Item README.md release
          Copy-Item LICENSE release
          Copy-Item packaging\START-HERE.txt release
          Compress-Archive -Path release\* -DestinationPath SoundPod-release.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundPod-Windows-x64
          path: SoundPod-release.zip
          if-no-files-found: error

      - name: Attach zip to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SoundPod-release.zip
